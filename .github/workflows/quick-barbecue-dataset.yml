name: Quick validated active-barbecuing dataset build

on:
  push:
    branches:
      - barbecue-dataset-build-20260902
    paths:
      - "quick_barbecue_build.py"
      - ".github/workflows/quick-barbecue-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-active-barbecuing-dataset-1000
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: /tmp/huggingface
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          python -m pip install \
            transformers==4.49.0 \
            Pillow==11.1.0 \
            ImageHash==4.3.1 \
            numpy==1.26.4 \
            requests==2.32.3 \
            tqdm==4.67.1 \
            safetensors==0.5.3

      - name: Collect, rank, deduplicate, package, and validate
        run: |
          python quick_barbecue_build.py \
            --target 1000 \
            --output quick_barbecue_output \
            --per-query 350 \
            --max-search-hits 3400 \
            --max-metadata-records 2800 \
            --max-downloads 2500 \
            --download-workers 12 \
            --max-side 1280 \
            --min-side 360 \
            --request-pause 0.8 \
            --phash-threshold 6 \
            --dhash-threshold 5 \
            --clip-batch-size 48 \
            --embedding-threshold 0.996 \
            --max-per-creator 45 \
            --max-per-query 180

      - name: Upload verified dataset
        uses: actions/upload-artifact@v4
        with:
          name: active-barbecuing-dataset-1000-valid
          path: |
            quick_barbecue_output/active_barbecuing_dataset_1000.zip
            quick_barbecue_output/active_barbecuing_review_sheets.zip
            quick_barbecue_output/build_summary.json
            quick_barbecue_output/selected_metadata.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
