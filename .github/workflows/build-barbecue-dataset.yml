name: Probe openly licensed image sources

on:
  push:
    branches:
      - barbecue-dataset-build-20260902
    paths:
      - "barbecue_dataset_builder/**"
      - ".github/workflows/build-barbecue-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Wikimedia Commons and WordPress Photo Directory
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          headers = {"User-Agent": "ActiveBarbecuingDatasetBuilder/1.0 (research; contact via GitHub Nathan12112006)"}
          tests = [
              (
                  "commons",
                  "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({
                      "action": "query",
                      "generator": "search",
                      "gsrsearch": "barbecue grilling person",
                      "gsrnamespace": 6,
                      "gsrlimit": 5,
                      "prop": "imageinfo",
                      "iiprop": "url|size|mime|extmetadata",
                      "iiurlwidth": 1200,
                      "format": "json",
                      "formatversion": 2,
                  }),
              ),
              (
                  "wordpress",
                  "https://wordpress.org/photos/wp-json/wp/v2/photos?" + urllib.parse.urlencode({
                      "search": "barbecue",
                      "per_page": 5,
                  }),
              ),
          ]
          for name, url in tests:
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read()
                  print(name, response.status, response.headers.get("content-type"), len(raw))
                  data = json.loads(raw)
                  if name == "commons":
                      print("commons pages", len(data.get("query", {}).get("pages", [])))
                  else:
                      print("wordpress rows", len(data))
          PY
