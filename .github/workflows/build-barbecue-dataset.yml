name: Build active-barbecuing dataset from Wikimedia Commons

on:
  push:
    branches:
      - barbecue-dataset-build-20260902
    paths:
      - "barbecue_dataset_builder/**"
      - ".github/workflows/build-barbecue-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HOME: /tmp/huggingface
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: barbecue_dataset_builder/requirements.txt

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchvision==0.21.0

      - name: Install dataset-builder dependencies
        run: python -m pip install -r barbecue_dataset_builder/requirements.txt

      - name: Build, filter, deduplicate, and validate 1,000 images
        run: |
          python barbecue_dataset_builder/commons_runner.py \
            --target 1000 \
            --output barbecue_dataset_output \
            --per-query 500 \
            --request-pause 2.0 \
            --desired-valid-candidates 3800 \
            --max-download-attempts 6000 \
            --person-pool 2600 \
            --download-workers 10 \
            --max-side 1600 \
            --min-side 384 \
            --phash-threshold 7 \
            --dhash-threshold 6 \
            --clip-batch-size 32 \
            --person-batch-size 8 \
            --min-person-confidence 0.24 \
            --embedding-similarity-threshold 0.987 \
            --max-per-creator 28 \
            --max-per-query 120

      - name: Upload completed dataset, review sheets, and audit files
        uses: actions/upload-artifact@v4
        with:
          name: active-barbecuing-open-license-1000
          path: |
            barbecue_dataset_output/active_barbecuing_open_license_1000.zip
            barbecue_dataset_output/active_barbecuing_review_1000.zip
            barbecue_dataset_output/build_summary.json
            barbecue_dataset_output/ranked_review_candidates.csv
            barbecue_dataset_output/commons_candidates.jsonl
            barbecue_dataset_output/download_errors.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
