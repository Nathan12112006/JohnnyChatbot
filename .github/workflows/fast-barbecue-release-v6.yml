name: Time-bounded active-barbecuing dataset release

on:
  push:
    branches:
      - barbecue-dataset-build-20260902
    paths:
      - "fast_barbecue_release_v6.py"
      - ".github/workflows/fast-barbecue-release-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: time-bounded-active-barbecuing-release-v6
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            Pillow==11.1.0 \
            ImageHash==4.3.1 \
            requests==2.32.3 \
            tqdm==4.67.1

      - name: Build and validate exactly 1,000 images
        run: |
          python fast_barbecue_release_v6.py \
            --target 1000 \
            --output fast_barbecue_output_v6 \
            --per-query 80 \
            --search-limit 2200 \
            --metadata-limit 2200 \
            --download-limit 1900 \
            --workers 40 \
            --pause 0.35 \
            --max-side 512 \
            --min-side 224 \
            --phash-limit 3 \
            --dhash-limit 3 \
            --creator-cap 50 \
            --query-cap 260

      - name: Publish stable public files
        run: |
          TAG="active-barbecuing-dataset-1000-v6"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            fast_barbecue_output_v6/active_barbecuing_dataset_1000.zip \
            fast_barbecue_output_v6/active_barbecuing_preview_100.jpg \
            fast_barbecue_output_v6/build_summary.json \
            --target "$GITHUB_SHA" \
            --title "Active Barbecuing Image Dataset — 1,000 images" \
            --notes "Expanded multilingual Wikimedia Commons collection. The ZIP passed archive integrity, exact image count, image decoding, and SHA-256 duplicate checks. Relevance selection is automated and should be manually reviewed before training."

      - name: Upload Actions artifact fallback
        uses: actions/upload-artifact@v4
        with:
          name: active-barbecuing-dataset-1000-v6
          path: |
            fast_barbecue_output_v6/active_barbecuing_dataset_1000.zip
            fast_barbecue_output_v6/active_barbecuing_preview_100.jpg
            fast_barbecue_output_v6/build_summary.json
            fast_barbecue_output_v6/selected_metadata.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
